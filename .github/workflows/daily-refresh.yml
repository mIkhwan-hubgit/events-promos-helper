# Refreshes every tab each morning, so visitors always see fresh events.
# The results go straight into the online Turso database.
name: Daily refresh

on:
  schedule:
    - cron: "7 23 * * *" # 23:00 UTC = 7:00 a.m. Malaysia time (GitHub's clock is UTC)
  workflow_dispatch: # adds a "Run workflow" button on GitHub, to run it by hand

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      # Keep Gemini's saved answers between runs, so unchanged pages don't use quota again
      - uses: actions/cache@v6
        with:
          path: .cache
          key: gemini-cache-${{ github.run_id }}
          restore-keys: gemini-cache-

      - run: pip install -r requirements.txt

      - run: python refresh_all.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}